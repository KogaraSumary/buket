<style id="app-css">
/* Layout: одна узкая колонка, как страница альбома: дата, букет, подпись, все букеты */
:root{
  --bg:#edf1ea; --fg:#1d2820; --muted:#5b6a5f; --card:#f8faf5; --line:#d2dbcd; --soft:#e1e8dc;
  --accent:#b3305c; --accent-fg:#ffffff; --shadow:rgba(30,50,35,.45);
  --display:"Philosopher", Georgia, serif; --body:"Manrope", system-ui, sans-serif; --hand:"Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --fg:#e4ebe2; --muted:#98a79b; --card:#19221c; --line:#2b372f; --soft:#1e2922;
  --accent:#ee7fa4; --accent-fg:#2a0d18; --shadow:rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --fg:#e4ebe2; --muted:#98a79b; --card:#19221c; --line:#2b372f; --soft:#1e2922;
  --accent:#ee7fa4; --accent-fg:#2a0d18; --shadow:rgba(0,0,0,.85); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--soft);border-radius:999px;align-self:flex-start}
.tab{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.eyebrow{margin:0;font:700 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 0;font:700 clamp(30px,7vw,46px)/1.05 var(--display);text-wrap:balance}
.frame{position:relative;border-radius:4px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line),0 22px 44px -26px var(--shadow);animation:bloom .7s ease-out}
.frame canvas{cursor:grab;touch-action:pan-y}

.frame canvas,.thumb canvas,.opt canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:var(--soft)}

.pending,.hint{margin:0;color:var(--muted)}

.thumb,.opt{border:0;padding:0;background:none;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:600 12px/1.3 var(--body);min-width:0}

.thumb span,.opt span{color:var(--muted)}

<script id="app-js">
(function(){
'use strict';
const TAU=Math.PI*2;
let DATA={days:{}};
const T3=window.THREE;
const HAS3D=!!T3&&(()=>{try{const c=document.createElement('canvas');return!!(c.getContext('webgl')||c.getContext('experimental-webgl'));}catch(e){return false;}})();

/* ================= случайность и цвет ================= */
function rngOf(a){a=a>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function mixSeed(a,b){return hashStr(a+'/'+b);}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function wrapH(h){return((h%360)+360)%360;}
function css(h,s,l,a){return a==null?`hsl(${wrapH(h).toFixed(1)},${clamp(s,0,100)}%,${clamp(l,0,100)}%)`:`hsla(${wrapH(h).toFixed(1)},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${a})`;}
function C(hex){return new T3.Color(hex).convertSRGBToLinear();}
function hslC(h,s,l){return new T3.Color().setHSL(wrapH(h)/360,clamp(s,0,100)/100,clamp(l,0,100)/100).convertSRGBToLinear();}
function pair(a,b){return[C(a),C(b)];}

/* ================= виды цветов ================= */
const KINDS=[
  {name:'ромашка',pl:'ромашки',n:[13,17],type:'long',layers:2,wk:.13,center:.22,shrink:.1,e:[.08,.2],cup:.12,curl:-.06,dome:.55},
  {name:'маргаритка',pl:'маргаритки',n:[20,26],type:'long',layers:3,wk:.08,center:.18,shrink:.13,e:[.12,.5],cup:.2,dome:.5},
  {name:'космея',pl:'космеи',n:[8,8],type:'notch',layers:1,wk:.3,center:.14,e:[.3,.3],cup:.3,curl:.05,stamens:18,dome:.5},
  {name:'астра',pl:'астры',n:[18,24],type:'point',layers:4,wk:.1,center:.13,shrink:.17,e:[.15,1],cup:.35,dome:.5},
  {name:'лилия',pl:'лилии',n:[3,3],type:'point',layers:2,wk:.28,center:.06,shrink:.03,e:[.45,.55],cup:.35,curl:-.4,lily:1,dome:.4},
  {name:'анемона',pl:'анемоны',n:[5,6],type:'round',layers:2,wk:.42,center:.2,shrink:.28,e:[.35,.6],cup:.35,stamens:30,dark:1,dome:.7},
  {name:'пион',pl:'пионы',n:[7,9],type:'round',layers:5,wk:.4,center:.08,shrink:.15,e:[.35,1.3],cup:.6,ruffle:.14,big:1,dome:.5},
  {name:'роза',pl:'розы',spiral:26,type:'round',wk:.52,center:.04,e:[.3,1.42],cup:.75,curl:-.12,ruffle:.04,big:1,dome:.5},
  {name:'георгин',pl:'георгины',n:[12,16],type:'point',layers:5,wk:.15,center:.07,shrink:.15,e:[.08,1.25],cup:.7,big:1,dome:.5},
  {name:'подсолнух',pl:'подсолнухи',n:[18,24],type:'long',layers:2,wk:.1,center:.36,shrink:.07,e:[.05,.18],cup:.15,curl:-.05,hue:44,dome:.28},
  {name:'мак',pl:'маки',n:[4,4],type:'round',layers:2,wk:.58,center:.15,shrink:.12,e:[.6,.85],cup:.55,ruffle:.1,stamens:34,dark:1,dome:.8},
  {name:'лотос',pl:'лотосы',n:[8,9],type:'point',layers:3,wk:.28,center:.17,shrink:.18,e:[.45,1.15],cup:.55,pod:1,big:1,dome:.35},
  {name:'хризантема',pl:'хризантемы',n:[22,28],type:'long',layers:4,wk:.07,center:.08,shrink:.15,e:[.1,1.2],cup:.45,curl:.08,dome:.5}
];
function bell(t,p){const u=t<p?t/p*.5:.5+(t-p)/(1-p)*.5;return Math.sqrt(Math.max(0,1-Math.pow(2*u-1,2)));}
function wf(t,type){
  if(type==='round')return bell(t,.62);
  if(type==='long')return Math.pow(bell(t,.5),.6)*(1-.25*t);
  if(type==='point'||type==='leaf')return Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(t,.75))),1.15);
  if(t<.75)return Math.pow(Math.sin(t/.75*Math.PI/2),.8);
  return 1-(t-.75)/.25*.55;
}

/* ================= букет: параметры ================= */
const BCACHE=new Map();
function makeBouquet(seed){
  if(BCACHE.has(seed))return BCACHE.get(seed);
  const r=rngOf(mixSeed(seed,'bouquet'));
  let H=r()*360;if(H>70&&H<165)H+=110;H%=360;
  const S0=52+r()*26;
  const noGreen=h=>{h=wrapH(h);return h>70&&h<165?(h<118?44:205):h;};
  const hueFor=main=>{if(main)return{h:H,s:S0,l:58};const v=r();
    if(v<.18)return{h:H,s:12,l:88,white:true};
    if(v<.32)return{h:noGreen(H+180+(r()-.5)*30),s:S0,l:56};
    const off=[0,28,-28,52,-14][Math.floor(r()*5)];return{h:noGreen(H+off),s:S0+(r()-.5)*14,l:56+(r()-.5)*10};};
  const pickKind=(big,rr)=>{const pool=big?KINDS.filter(k=>k.big):KINDS.filter(k=>!k.big||rr()<.3);return pool[Math.floor(rr()*pool.length)];};
  const V=(x,y,z)=>({x,y,z});
  const flowers=[];
  const add=(main,pos,dir,size,k)=>{const fs=mixSeed(seed,'f'+flowers.length),rr=rngOf(fs),K=pickKind(main,rr);let hs=hueFor(main);
    if(K.hue!=null&&!hs.white)hs={h:K.hue,s:88,l:56};hs.h2=K.hue!=null?hs.h-16:hs.h+(rr()<.5?-1:1)*(14+rr()*26);
    flowers.push({K,hs,seed:fs,pos,dir,size,spin:rr()*TAU,main});};
  /* головы лежат на куполе радиуса DR с центром DC и смотрят наружу; расстояние по куполу между соседями не меньше суммы их радиусов */
  const DR=2.2,DC=-1.05,onDome=(pol,az,size,main)=>{const s=Math.sin(pol),c=Math.cos(pol),d=V(s*Math.cos(az),c,s*Math.sin(az));add(main,V(d.x*DR,DC+d.y*DR,d.z*DR),d,size);};
  const sM=.8,s1=.63,s2=.56,K=.95,p1=(sM+s1)*K/DR,p2=p1+(s1+s2)*K/DR;
  onDome(0,0,sM,true);
  const o1=r()*TAU;
  for(let i=0;i<6;i++)onDome(p1,o1+i*TAU/6+(r()-.5)*.08,s1*(.96+r()*.04));
  for(let i=0;i<8;i++)onDome(p2,o1+(i+.5)*TAU/8+(r()-.5)*.06,s2*(.96+r()*.04));
  const leaves=[];for(let i=0;i<12;i++)leaves.push({a:o1+.3+i*TAU/12+(r()-.5)*.2,e:.02+r()*.28,L:1.15+r()*.45,W:.22+r()*.07,serr:r()<.5});
  const fillers=[];for(let i=0;i<14;i++){const a=r()*TAU,rad=1.05+r()*.65;fillers.push({x:Math.cos(a)*rad,y:.2+r()*.9,z:Math.sin(a)*rad,n:6+Math.floor(r()*5),s:mixSeed(seed,'fi'+i)});}
  const kraft=r()<.4;
  const wm=kraft?{h:32,s:36,l:70}:{h:wrapH(H+180+(r()-.5)*40),s:18+r()*16,l:84};
  const wm2={h:wrapH(H+(r()-.5)*30),s:30+r()*20,l:80};
  const rm={h:H+(r()-.5)*20,s:62,l:46,h2:H+12};
  const names=[];flowers.slice(1).forEach(f=>{if(f.K!==flowers[0].K&&names.indexOf(f.K.pl)<0)names.push(f.K.pl);});
  const B={seed,H,flowers,leaves,fillers,wm,wm2,rm,main:flowers[0].K,others:names.slice(0,3),leafHue:100+r()*30};
  if(BCACHE.size>80)BCACHE.clear();BCACHE.set(seed,B);return B;
}

/* ================= текстуры (общие) ================= */
const TEX={};
function canvasTex(key,size,draw,repeat){if(TEX[key])return TEX[key];const cv=document.createElement('canvas');cv.width=cv.height=size;draw(cv.getContext('2d'),size);
  const t=new T3.CanvasTexture(cv);t.encoding=T3.sRGBEncoding;if(repeat){t.wrapS=t.wrapT=T3.RepeatWrapping;}t.anisotropy=4;TEX[key]=t;return t;}
function dotTex(){return canvasTex('dot',64,(c,s)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);});}
function gradTex(steps){const key='grad'+steps;if(TEX[key])return TEX[key];const d=new Uint8Array(steps*3);for(let i=0;i<steps;i++){const v=Math.round(60+195*i/(steps-1));d[i*3]=d[i*3+1]=d[i*3+2]=v;}
  const t=new T3.DataTexture(d,steps,1,T3.RGBFormat);t.minFilter=t.magFilter=T3.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;TEX[key]=t;return t;}
const SYL=['ра','но','ве','сна','ли','то','ми','ка','ре','дом','сад','ут','ро','гор','од','за','на','пе','мен','ст','во','ни','ты','мы','лю','бо','вь','се','год','ня'];
const HEADW=['ВЕСНА','ЛЮБОВЬ','СЕГОДНЯ','НОВОСТИ','УТРО','СЧАСТЬЕ','ЦВЕТЫ','ПОГОДА','ВЕСТИ','НЕЖНОСТЬ','ТЫ','МЕЧТА','ТЕПЛО','СВЕТ','БУКЕТ'];
function gib(r,len){let s='';while(s.length<len){let w='';const n=1+Math.floor(r()*3);for(let i=0;i<n;i++)w+=SYL[Math.floor(r()*SYL.length)];s+=w+' ';}return s;}
function newsTex(){return canvasTex('news',512,(c,s)=>{const r=rngOf(7);c.fillStyle='#f3efe4';c.fillRect(0,0,s,s);c.fillStyle='rgba(20,20,20,.85)';
  for(let col=0;col<3;col++){let y=14;if(col===1){c.font='bold 34px Georgia,serif';c.fillText(HEADW[3],8+col*170,44);y=64;}
    c.font='11px Georgia,serif';for(;y<s;y+=13){if(r()<.05){y+=10;continue;}c.fillText(gib(r,28),8+col*170,y);}}
  c.fillStyle='rgba(30,30,30,.7)';c.fillRect(176,300,150,100);},true);}
function binTex(){return canvasTex('bin',256,(c,s)=>{const r=rngOf(3);c.fillStyle='#000';c.fillRect(0,0,s,s);c.font='bold 15px "Courier New",monospace';c.textAlign='center';c.textBaseline='middle';
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){c.fillStyle=`rgba(255,255,255,${(.35+r()*.65).toFixed(2)})`;c.fillText(r()<.5?'0':'1',x*16+8,y*16+8);}},true);}
function marbleTex(){return canvasTex('marble',512,(c,s)=>{const r=rngOf(11);c.fillStyle='#f6f3ee';c.fillRect(0,0,s,s);
  for(let k=0;k<26;k++){let x=r()*s,y=0;c.beginPath();c.moveTo(x,y);c.strokeStyle=`rgba(${90+r()*40|0},${90+r()*40|0},${100+r()*40|0},${(.08+r()*.3).toFixed(2)})`;c.lineWidth=.5+r()*2.5;
    for(;y<s;y+=8){x+=(r()-.5)*14+Math.sin(y*.02+k)*3;c.lineTo(x,y);}c.stroke();}},true);}
function woodTex(){return canvasTex('wood',512,(c,s)=>{const r=rngOf(5);c.fillStyle='#bfbfbf';c.fillRect(0,0,s,s);
  for(let i=0;i<120;i++){const x=i/120*s+Math.sin(i)*3;c.strokeStyle=`rgba(${i%3?255:40},${i%3?255:30},${i%3?255:20},${(.05+r()*.12).toFixed(2)})`;c.lineWidth=1+r()*3;c.beginPath();
    for(let y=0;y<=s;y+=16){const xx=x+Math.sin(y*.015+i*.3)*6+Math.sin(y*.05)*2;y?c.lineTo(xx,y):c.moveTo(xx,y);}c.stroke();}},true);}
function noiseTex(){return canvasTex('noise',256,(c,s)=>{const d=c.createImageData(s,s),r=rngOf(9);for(let i=0;i<s*s;i++){const v=110+r()*110|0;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255;}c.putImageData(d,0,0);},true);}

/* ================= геометрия ================= */
let Y=T3?new T3.Vector3(0,1,0):null;
function petalGeo(L,W,type,o,colorFn){
  const g=new T3.PlaneGeometry(1,1,o.sx||6,o.sy||10),p=g.attributes.position,cols=new Float32Array(p.count*3),c=new T3.Color();
  for(let i=0;i<p.count;i++){const u=p.getX(i)+.5,t=p.getY(i)+.5,s=(u-.5)*2;
    let w=wf(t,type);if(o.ruffle)w*=1+o.ruffle*Math.sin(t*17+o.phase)*Math.min(1,t*2.5);
    let y=t*L;if(type==='notch'&&t>.75)y-=(1-Math.abs(s))*.14*L*(t-.75)/.25;
    const z=(o.cup||0)*s*s*w*W*2+(o.curl||0)*t*t*L+(o.ruffle?o.ruffle*Math.sin(t*14+s*2.5+o.phase)*W*w*.8*t:0);
    p.setXYZ(i,s*w*W,y,z);colorFn(t,s,c);cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}
  g.setAttribute('color',new T3.BufferAttribute(cols,3));g.computeVertexNormals();return g;

function placeMat(a,e,b,y0){const d=new T3.Vector3(Math.cos(a)*Math.cos(e),Math.sin(e),Math.sin(a)*Math.cos(e));

  const m=new T3.PointsMaterial({color:C(col),size,map:dotTex(),transparent:true,depthWrite:false,blending:T3.AdditiveBlending});const p=new T3.Points(g,m);(static_?ctx.root:ctx.bq).add(p);
  if(upd)ctx.anims.push((dt,t)=>{upd(pos,data,dt,t,m);g.attributes.position.needsUpdate=true;});}
function sparkles(ctx,r,n,col,size){pointsCloud(ctx,n,()=>{const a=r()*TAU,rad=.6+r()*1.9;return{x:Math.cos(a)*rad,y:-1+r()*3.4,z:Math.sin(a)*rad};},col,size,(p,d,dt,t,m)=>{m.opacity=.65+.35*Math.sin(t*2.3);});}
function snow(ctx,r,n){pointsCloud(ctx,n,()=>({x:(r()-.5)*7,y:-3+r()*7,z:(r()-.5)*5,v:.2+r()*.3}),'#ffffff',.06,(p,d,dt)=>{d.forEach((q,i)=>{q.y-=q.v*dt;if(q.y<-3)q.y=3.5;p[i*3+1]=q.y;p[i*3]=q.x+Math.sin(q.y*2+i)*.1;});},true);}
function embers(ctx,r,n){pointsCloud(ctx,n,()=>({x:(r()-.5)*3.6,y:-1+r()*4,z:(r()-.5)*3.6,v:.3+r()*.6}),'#ffb04a',.06,(p,d,dt,t)=>{d.forEach((q,i)=>{q.y+=q.v*dt;if(q.y>3.2)q.y=-.5;p[i*3+1]=q.y;p[i*3]=q.x+Math.sin(t*2+i)*.08;});},true);}
function fireflies(ctx,r,n){pointsCloud(ctx,n,()=>({x:(r()-.5)*5,y:-1.5+r()*4,z:(r()-.5)*4,p:r()*TAU}),'#fff3a0',.09,(p,d,dt,t,m)=>{d.forEach((q,i)=>{p[i*3]=q.x+Math.sin(t*.5+q.p)*.3;p[i*3+1]=q.y+Math.sin(t*.7+q.p*2)*.2;p[i*3+2]=q.z+Math.cos(t*.4+q.p)*.3;});m.opacity=.7+.3*Math.sin(t*3);},true);}

function palOf(st,role,sp){const d=st.pal&&st.pal(role,sp);if(d)return d;
  switch(role){case'petal':return[hslC(sp.h,sp.s,sp.l-20),hslC(sp.h2??sp.h,sp.s,sp.l+12)];
    case'center':return[hslC(sp.h,sp.s,sp.l-14),hslC(sp.h2??sp.h,sp.s,sp.l+10)];
    case'stamen':return[hslC(sp.h,sp.s*.6,sp.l-10),hslC(sp.h,sp.s,sp.l)];
    case'leaf':return leafG(sp).map(x=>x);
    case'stem':return[hslC(110,35,24),hslC(100,35,36)];
    case'filler':return[hslC(60,15,86),hslC(60,10,98)];
    default:return[hslC(sp.h,sp.s,sp.l-10),hslC(sp.h2??sp.h,sp.s,sp.l+6)];}}
function makeObj(ctx,geo,role,sp){const st=ctx.st;if(st.obj)return st.obj(geo,role,sp,ctx);
  const g=new T3.Mesh(geo,ctx.mat('m:'+role,()=>{const m=st.mat(role,sp,ctx);if(m.envMapIntensity!=null)m.envMapIntensity=st.env||.5;return m;}));

function headObj(ctx,f){

  const pal=palOf(st,'petal',f.hs),cf=(t,s,o)=>{o.copy(pal[0]).lerp(pal[1],t);o.multiplyScalar(1-.12*s*s);};
  const petals=[],cr=R*K.center,base=cr*.5,rot=r()*TAU;
  if(K.spiral){const m=K.spiral;for(let i=0;i<m;i++){const fr=i/m,L=R*(1-fr*.72),W=L*K.wk*(1-fr*.2),e=K.e[0]+(K.e[1]-K.e[0])*Math.pow(fr,.8);
      const g=petalGeo(L,W,K.type,{...lo,cup:K.cup*(.6+fr*.6),curl:(K.curl||0)*(1-fr)+fr*.12,ruffle:K.ruffle,phase:r()*TAU},cf);g.applyMatrix4(placeMat(rot+i*2.39996,e,fr*.05,fr*.12));petals.push(g);}}
  else{const n=K.n[0]+Math.floor(r()*(K.n[1]-K.n[0]+1));
    for(let k=0;k<K.layers;k++){const L=(R-base)*(1-k*(K.shrink||0)),W=R*K.wk*(1-k*.08),e=K.e[0]+(K.e[1]-K.e[0])*(K.layers>1?k/(K.layers-1):0);
      for(let i=0;i<n;i++){const a=rot+(i+(k%2?.5:0))*TAU/n+(r()-.5)*.08;
        const g=petalGeo(L*(.93+r()*.12),W*(.92+r()*.14),K.type,{...lo,cup:K.cup,curl:K.curl||0,ruffle:K.ruffle,phase:r()*TAU},cf);g.applyMatrix4(placeMat(a,e+(r()-.5)*.06,base*(1-k*.15),k*.03));petals.push(g);}}}
  const grp=new T3.Group();grp.add(makeObj(ctx,merge(petals),'petal',f.hs));
  let cs;if(K.dark)cs={h:275,s:30,l:20,h2:300};else if(K.pod)cs={h:72,s:55,l:52,h2:60};else if(r()<.65||f.hs.white)cs={h:44,s:85,l:50,h2:30};else cs={h:f.hs.h+180,s:50,l:40,h2:f.hs.h+160};
  if(cr>.03){const cp=palOf(st,'center',cs),dome=K.dome||.5,parts=[];
    const d=new T3.SphereGeometry(cr,st.flat?8:22,st.flat?3:8,0,TAU,0,Math.PI/2);d.applyMatrix4(new T3.Matrix4().makeScale(1,dome,1));tint(d,cp[0],cp[1],'y',0,cr*dome);parts.push(d);
    const N=Math.max(8,Math.round(1100*cr*cr)),sz=cr/Math.sqrt(N)*.62;
    for(let i=0;i<N;i++){const rr=cr*.92*Math.sqrt((i+.5)/N),a=i*2.39996,y=cr*dome*Math.sqrt(Math.max(0,1-(rr/cr)**2));const s=new T3.IcosahedronGeometry(sz,0);
      s.translate(Math.cos(a)*rr,y,Math.sin(a)*rr);tint(s,i%2?cp[1]:cp[0]);parts.push(s);}
    grp.add(makeObj(ctx,merge(parts),'center',cs));}
  const sts=[];
  if(K.lily||K.stamens){const sp={h:K.dark?270:K.lily?24:46,s:K.dark?25:85,l:K.dark?14:48},sc=palOf(st,'stamen',sp),n=K.lily?6:K.stamens;
    for(let i=0;i<n;i++){const a=K.lily?rot+i*TAU/6+.3:r()*TAU,l0=K.lily?0:cr*.6,l1=K.lily?.55+r()*.12:cr*(1.4+r()*.5),h1=K.lily?.42:cr*(.5+r()*.4);
      const p0=new T3.Vector3(Math.cos(a)*l0,cr*.2,Math.sin(a)*l0),p1=new T3.Vector3(Math.cos(a)*l1,h1,Math.sin(a)*l1);
      const c1=cylBetween(p0,p1,K.lily?.012:.006,4);tint(c1,sc[1]);sts.push(c1);const an=new T3.IcosahedronGeometry(K.lily?.04:.022,0);if(K.lily)an.scale(1,.5,1);an.translate(p1.x,p1.y,p1.z);tint(an,sc[0]);sts.push(an);}
    grp.add(makeObj(ctx,merge(sts),'stamen',sp));}
  return grp;
}
function WR(y){return .13+(y+2.1)/2.1*1.42;}
function wrapGeo(rMul,topAdd,phase,c0,c1){const cols=96,rows=12,pos=[],uv=[],idx=[],colA=[];
  for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){const th=i/cols*TAU,top=-.08+topAdd+.14*Math.sin(th*3+phase)+.05*Math.sin(th*7+phase*2),v=j/rows,y=-2.1+(top+2.1)*v;
    const rr=WR(y)*rMul*(1+.05*Math.sin(th*8+phase));pos.push(Math.cos(th)*rr,y,Math.sin(th)*rr);uv.push(i/cols*3,v);const c=c0.clone().lerp(c1,v);colA.push(c.r,c.g,c.b);}
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=j*(cols+1)+i,b=a+cols+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new T3.BufferGeometry();g.setAttribute('position',new T3.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T3.Float32BufferAttribute(uv,2));g.setAttribute('color',new T3.Float32BufferAttribute(colA,3));g.setIndex(idx);g.computeVertexNormals();return g;}
function buildScene(e,st,R){

  const scene=new T3.Scene(),root=new T3.Group(),bq=new T3.Group();scene.add(root);root.add(bq);
  const mats=new Map(),ctx={st,B,root,bq,scene,anims:[],mats,mat(k,f){if(!mats.has(k))mats.set(k,f());return mats.get(k);}};
  const bcv=document.createElement('canvas');bcv.width=bcv.height=512;st.bg(bcv.getContext('2d'),512,rngOf(mixSeed(e.seed,'bg')),B);const bgT=new T3.CanvasTexture(bcv);bgT.encoding=T3.sRGBEncoding;scene.background=bgT;ctx.bgT=bgT;

  const S=buildScene(e,st,R);S.ctx.root.rotation.y=.35;S.ctx.anims.forEach(f=>f(0,1));const comp=makeComposer(R,S,st,rs,rs);if(comp)comp.render();else R.render(S.scene,S.cam);
  cv.width=cv.height=px;const c=cv.getContext('2d');c.imageSmoothingEnabled=!st.pixel;c.drawImage(R.domElement,0,0,px,px);disposeScene(S);});}

let anim=null;
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(!HAS3D){if(loading)loading.textContent='Этот браузер не умеет показывать 3D. Открой страницу в Chrome или Safari.';return;}

  try{R=new T3.WebGLRenderer({canvas:cv,antialias:!st.pixel});}catch(err){if(loading)loading.textContent='Не получилось включить 3D на этом устройстве.';return;}

  let rw;if(st.pixel){R.setPixelRatio(1);R.setSize(st.pixel,st.pixel,false);cv.classList.add('pix');rw=st.pixel;}else{R.setPixelRatio(dpr);R.setSize(size,size,false);rw=size*dpr;}
  let S,comp,alive=true,th=.35,tilt=0,last=performance.now(),hold=0,drag=null,t=0;
  requestAnimationFrame(()=>{if(!alive)return;try{S=buildScene(e,st,R);comp=makeComposer(R,S,st,rw,rw);}catch(err){console.error(err);if(loading)loading.textContent='Не получилось собрать букет.';return;}if(loading){loading.hidden=true;loading.style.display='none';}requestAnimationFrame(tick);});
  function tick(now){if(!alive)return;if(!cv.isConnected){stop();return;}const dt=Math.min(.1,(now-last)/1000);last=now;
    if(!document.hidden){t+=dt;if(!drag&&now>hold&&!reduce)th+=dt*TAU/36;if(!drag)tilt*=.96;
      S.ctx.root.rotation.y=th;S.ctx.root.rotation.x=tilt;S.ctx.bq.position.y=reduce?0:Math.sin(t*.9)*.035;S.ctx.anims.forEach(f=>f(dt,t));if(st.anim)st.anim(S.ctx,dt,t);
      if(comp)comp.render();else R.render(S.scene,S.cam);}
    requestAnimationFrame(tick);}
  cv.addEventListener('pointerdown',ev=>{drag={x:ev.clientX,y:ev.clientY,th,tilt};try{cv.setPointerCapture(ev.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',ev=>{if(!drag)return;th=drag.th+(ev.clientX-drag.x)*.011;tilt=clamp(drag.tilt+(ev.clientY-drag.y)*.004,-.35,.45);});

  function stop(){if(!alive)return;alive=false;try{if(S)disposeScene(S);R.dispose();R.forceContextLoss&&R.forceContextLoss();}catch(_){}}

/* ================= даты и выбор ================= */
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtDate(k){const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function sorted(){return Object.keys(DATA.days).filter(k=>{const e=DATA.days[k];return e&&STYLES[e.s];}).sort();}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function candidates(day){
  const r=rngOf(hashStr('choice:'+day)),recent={};
  sorted().filter(k=>k<day).slice(-6).forEach(k=>{recent[DATA.days[k].s]=1;});
  let pool=shuffle(STYLE_KEYS.filter(k=>!recent[k]),r);if(pool.length<3)pool=shuffle(STYLE_KEYS.slice(),r);
  return pool.slice(0,3).map(s=>({s,seed:hashStr(day+':'+s)}));
}
function titleOf(e){const B=makeBouquet(e.seed),st=STYLES[e.s],o=B.others;
  const comp=o.length?'В центре '+B.main.name+', вокруг '+(o.length>1?o.slice(0,-1).join(', ')+' и '+o[o.length-1]:o[0])+'.':'Весь из цветов одного вида: '+B.main.pl+'.';
  return{name:cap(st.adj)+' букет',desc:cap(st.desc)+'. '+comp};}

const WIDGET_SRC="// Букет дня: виджет для приложения Scriptable (iPhone)\n// Показывает последний подаренный букет и записку к нему,\n// а когда появляется новый букет, присылает уведомление.\nconst SITE = \"__SITE__\";\n\nconst fm = FileManager.local();\nconst dir = fm.joinPath(fm.documentsDirectory(), \"buket\");\nif (!fm.fileExists(dir)) fm.createDirectory(dir);\nconst jPath = fm.joinPath(dir, \"today.json\");\nconst iPath = fm.joinPath(dir, \"today.jpg\");\n\nasync function load() {\n  try {\n    const r = new Request(SITE + \"today.json?t=\" + Date.now());\n    r.timeoutInterval = 20;\n    const j = await r.loadJSON();\n    if (!j || !j.img) throw new Error(\"пусто\");\n    const old = fm.fileExists(jPath) ? JSON.parse(fm.readString(jPath)) : null;\n    // новый букет: присылаем уведомление (в первый запуск не присылаем)\n    if (old && old.img !== j.img) {\n      try {\n        const n = new Notification();\n        n.title = \"Новый букет 🌸\";\n        n.body = j.note && j.note.length ? j.note : j.name;\n        n.openURL = SITE;\n        n.sound = \"default\";\n        await n.schedule();\n      } catch (e) {}\n    }\n    let img;\n    if (old && old.img === j.img && fm.fileExists(iPath)) {\n      img = fm.readImage(iPath);\n    } else {\n      img = await new Request(SITE + j.img).loadImage();\n      fm.writeImage(iPath, img);\n    }\n    fm.writeString(jPath, JSON.stringify(j));\n    return { j, img };\n  } catch (e) {\n    if (fm.fileExists(jPath)) {\n      return { j: JSON.parse(fm.readString(jPath)), img: fm.fileExists(iPath) ? fm.readImage(iPath) : null };\n    }\n    return null;\n  }\n}\n\nconst ink = new Color(\"#3a2430\");\nconst accent = new Color(\"#b3305c\");\n\nfunction background(w) {\n  const g = new LinearGradient();\n  g.colors = [new Color(\"#fff7f2\"), new Color(\"#f2e6f3\")];\n  g.locations = [0, 1];\n  w.backgroundGradient = g;\n}\n\nasync function build() {\n  const data = await load();\n  const fam = config.widgetFamily || \"large\";\n  const w = new ListWidget();\n  w.url = SITE;\n  w.refreshAfterDate = new Date(Date.now() + 20 * 60 * 1000);\n  background(w);\n\n  if (!data) {\n    w.addSpacer();\n    const t = w.addText(\"Первый букет скоро появится 🌸\");\n    t.font = Font.mediumRoundedSystemFont(15);\n    t.textColor = ink;\n    t.centerAlignText();\n    w.addSpacer();\n    return w;\n  }\n  const j = data.j, img = data.img;\n  const words = j.note && j.note.length ? j.note : j.name;\n\n  if (fam === \"small\") {\n    w.setPadding(0, 0, 0, 0);\n    if (img) w.backgroundImage = img;\n    w.addSpacer();\n    if (j.note) {\n      const s = w.addStack();\n      s.setPadding(5, 8, 6, 8);\n      s.backgroundColor = new Color(\"#000000\", 0.38);\n      const t = s.addText(j.note);\n      t.font = Font.semiboldRoundedSystemFont(11);\n      t.textColor = Color.white();\n      t.lineLimit = 2;\n      t.minimumScaleFactor = 0.7;\n    }\n    return w;\n  }\n\n  if (fam === \"medium\") {\n    w.setPadding(10, 10, 10, 14);\n    const row = w.addStack();\n    row.centerAlignContent();\n    if (img) {\n      const im = row.addImage(img);\n      im.imageSize = new Size(132, 132);\n      im.cornerRadius = 16;\n    }\n    row.addSpacer(12);\n    const col = row.addStack();\n    col.layoutVertically();\n    const d = col.addText(j.label);\n    d.font = Font.boldRoundedSystemFont(11);\n    d.textColor = accent;\n    col.addSpacer(6);\n    const n = col.addText(words);\n    n.font = Font.mediumRoundedSystemFont(j.note ? 17 : 14);\n    n.textColor = ink;\n    n.lineLimit = 5;\n    n.minimumScaleFactor = 0.6;\n    col.addSpacer();\n    return w;\n  }\n\n  // большой\n  w.setPadding(12, 12, 14, 12);\n  if (img) {\n    const top = w.addStack();\n    top.addSpacer();\n    const im = top.addImage(img);\n    im.imageSize = new Size(250, 250);\n    im.cornerRadius = 20;\n    top.addSpacer();\n  }\n  w.addSpacer(8);\n  const d = w.addText(j.label);\n  d.font = Font.boldRoundedSystemFont(12);\n  d.textColor = accent;\n  d.centerAlignText();\n  w.addSpacer(4);\n  const n = w.addText(words);\n  n.font = Font.mediumRoundedSystemFont(j.note ? 17 : 14);\n  n.textColor = ink;\n  n.centerAlignText();\n  n.lineLimit = 3;\n  n.minimumScaleFactor = 0.6;\n  return w;\n}\n\nconst widget = await build();\nif (config.runsInWidget) {\n  Script.setWidget(widget);\n} else {\n  // первый запуск в самом приложении: просим разрешение на уведомления\n  try {\n    const hello = new Notification();\n    hello.title = \"Уведомления включены 🌸\";\n    hello.body = \"Когда появится новый букет, придёт уведомление.\";\n    await hello.schedule();\n  } catch (e) {}\n  await widget.presentLarge();\n}\nScript.complete();\n";
/* ================= сайт: данные на GitHub ================= */
const app=document.getElementById('app');
let LOADED=false,mode=hashMode(),herSel=null,pickSel=null,draft=null;
function hashMode(){const h=location.hash.slice(1);return['all','pick','setup','widget'].indexOf(h)>=0?h:'her';}
function siteBase(){return location.origin+location.pathname.replace(/index\.html$/,'');}
function loadCfg(){try{const c=JSON.parse(localStorage.getItem('buket-gh')||'null');return c&&c.user&&c.repo&&c.token?c:null;}catch(e){return null;}}
function saveCfg(c){try{c?localStorage.setItem('buket-gh',JSON.stringify(c)):localStorage.removeItem('buket-gh');return true;}catch(e){return false;}}
let CFG=loadCfg();
const OWNER=()=>!!CFG;
async function loadData(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.days)DATA=d;}}catch(e){}LOADED=true;
  if(OWNER()&&mode==='her'&&!DATA.days[keyOf(new Date())])mode='pick';render();}
const GH='https://api.github.com';
async function gh(path,opt){opt=opt||{};return fetch(GH+'/repos/'+encodeURIComponent(CFG.user)+'/'+encodeURIComponent(CFG.repo)+path,Object.assign({},opt,{headers:{'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json'}}));}
function ghError(r){return r.status===401?'Ключ GitHub не подходит или устарел. Открой «Настройка» и вставь новый.':r.status===404?'Не нашёл хранилище на GitHub. Проверь имя аккаунта и хранилища в «Настройке».':r.status===403?'У ключа нет права записи. Создай ключ с правом «Contents: Read and write».':'GitHub ответил ошибкой '+r.status+'. Попробуй ещё раз.';}
async function getFile(p){const r=await gh('/contents/'+p+'?t='+Date.now());if(r.status===404)return null;if(!r.ok)throw new Error(ghError(r));return r.json();}
async function putFile(p,b64,msg,sha){const body={message:msg,content:b64};if(sha)body.sha=sha;const r=await gh('/contents/'+p,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(ghError(r));return r.json();}
const b64u=s=>btoa(unescape(encodeURIComponent(s)));
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function blobB64(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.onerror=rej;f.readAsDataURL(b);});}
function snapshot(e,size){return new Promise((res,rej)=>{try{const st=STYLES[e.s],R=thumbRenderer();setupRenderer(R,st);const rs=st.pixel?Math.round(st.pixel*1.2):size;R.setPixelRatio(1);R.setSize(rs,rs,false);
  const S=buildScene(e,st,R);S.ctx.root.rotation.y=.35;S.ctx.anims.forEach(f=>f(0,1));const comp=makeComposer(R,S,st,rs,rs);if(comp)comp.render();else R.render(S.scene,S.cam);
  const cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d');c.imageSmoothingEnabled=!st.pixel;c.drawImage(R.domElement,0,0,size,size);disposeScene(S);
  cv.toBlob(b=>b?res(b):rej(new Error('Не получилось сделать картинку букета.')),'image/jpeg',.9);}catch(err){rej(err);}});}

/* ================= интерфейс ================= */
function el(tag,props,kids){const e=document.createElement(tag);if(props)Object.keys(props).forEach(k=>{const v=props[k];
  if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);});

function bigCanvas(e){const f=el('div',{class:'frame'}),cv=el('canvas',{role:'img','aria-label':titleOf(e).name});f.appendChild(cv);f.appendChild(el('div',{class:'loading',text:'собираю букет…'}));
  requestAnimationFrame(()=>animate(cv,e,f));return f;}
function caption(e,withNote){const t=titleOf(e),box=el('div',{class:'caption'},[el('h2',{class:'name',text:t.name}),el('p',{class:'desc',text:t.desc}),el('p',{class:'spin',text:'Это объёмная модель: она медленно вращается, её можно покрутить пальцем или мышкой во все стороны.'})]);
  if(withNote&&e.n)box.appendChild(el('p',{class:'note',text:e.n}));return box;}
function thumb(e,size){const cv=el('canvas',{'aria-hidden':'true'});requestAnimationFrame(()=>drawStill(cv,e,size));return cv;}
function go(m){mode=m;herSel=null;history.replaceState(null,'',m==='her'?location.pathname+location.search:'#'+m);render();window.scrollTo(0,0);}
function tabs(){const t=el('nav',{class:'tabs','aria-label':'Разделы'});
  [['her','Её сад'],['pick','Выбрать на сегодня'],['setup','Настройка']].forEach(m=>{t.appendChild(el('button',{class:'tab','aria-pressed':String(mode===m[0]),onclick:()=>go(m[0])},[m[1]]));});return t;}
/* нижние ссылки видит только тот, у кого сохранён ключ; ей виджет и настройка открываются прямыми ссылками #widget и #setup */
function footer(){if(!OWNER())return null;return el('footer',{class:'foot'},[el('a',{href:'#widget',onclick:ev=>{ev.preventDefault();go('widget');}},['Как поставить виджет на iPhone (ссылка для неё: …/buket/#widget)'])]);}
function render(){queue.length=0;pumping=false;if(anim)anim.stop();app.textContent='';
  if(!LOADED){app.appendChild(el('p',{class:'pending',text:'Загружаю букеты…'}));return;}
  if(OWNER()&&mode!=='all'&&mode!=='widget')app.appendChild(tabs());
  if(mode==='all')renderAll();else if(mode==='setup')renderSetup();else if(mode==='widget')renderWidget();else if(mode==='pick'&&OWNER())renderPick();else renderHer();
  const f=mode!=='setup'&&mode!=='widget'?footer():null;if(f)app.appendChild(f);}

function renderHer(){
  const dates=sorted(),today=keyOf(new Date());
  if(!dates.length){app.appendChild(el('section',{class:'empty'},[el('p',{class:'eyebrow',text:'Цветочный календарь'}),el('h1',{text:'Первый букет скоро появится'}),
    el('p',{class:'pending',text:'Каждый день здесь будет новый объёмный букет, и каждый раз он сделан по-своему: из золота, фарфора, стекла, льда, звёзд, огня или газетных страниц.'})]));return;}
  const cur=herSel&&DATA.days[herSel]?herSel:dates[dates.length-1],e=DATA.days[cur],num=dates.indexOf(cur)+1;
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'Букет №'+num+(cur===today?' · сегодня':'')}),el('h1',{text:fmtDate(cur)})]));
  if(!herSel&&cur!==today)app.appendChild(el('p',{class:'pending',text:'Сегодняшний букет ещё собирается. Пока здесь '+(cur===keyOf(addDays(new Date(),-1))?'вчерашний.':'последний.')}));
  app.appendChild(bigCanvas(e));app.appendChild(caption(e,true));

    dates.slice().reverse().forEach(d=>{g.appendChild(el('button',{class:'thumb'+(d===cur?' is-on':''),'aria-label':'Букет за '+fmtDate(d),onclick:()=>{herSel=d;render();window.scrollTo(0,0);}},[thumb(DATA.days[d],120),el('span',{text:fmtDate(d)})]));});
    app.appendChild(el('section',{class:'herbarium'},[el('h3',{text:'Все букеты: '+dates.length+' '+plural(dates.length,'букет','букета','букетов')}),g]));}
}
function renderPick(){
  const today=keyOf(new Date()),cands=candidates(today),ex=DATA.days[today];
  if(pickSel==null){pickSel=0;if(ex)cands.forEach((cd,i)=>{if(cd.s===ex.s&&cd.seed===ex.seed)pickSel=i;});}
  const c=cands[pickSel];
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:fmtDate(today)+' · три варианта'}),el('h1',{text:'Какой букет подарить сегодня?'})]));
  if(ex)app.appendChild(el('p',{class:'pending',text:'Сегодня уже подарен «'+titleOf(ex).name+'». До полуночи можно заменить.'}));
  const opts=el('div',{class:'opts',role:'group','aria-label':'Варианты на сегодня'});
  cands.forEach((cd,i)=>{opts.appendChild(el('button',{class:'opt','aria-pressed':String(i===pickSel),onclick:()=>{pickSel=i;render();}},[thumb(cd,200),el('span',{text:titleOf(cd).name})]));});
  app.appendChild(opts);app.appendChild(bigCanvas(c));app.appendChild(caption(c,false));
  const ta=el('textarea',{id:'note',rows:'3',maxlength:'240',placeholder:'Например: доброе утро, солнце'});
  ta.value=draft!=null?draft:(ex&&ex.n)||'';ta.addEventListener('input',()=>{draft=ta.value;});
  const status=el('p',{class:'status',role:'status'});
  const btn=el('button',{class:'give'},[ex?'Подарить этот вместо прежнего':'Подарить этот букет']);
  btn.addEventListener('click',()=>give(today,c,ta.value,btn,status));
  app.appendChild(el('div',{class:'form'},[el('label',{for:'note',text:'Записка к букету (будет и на сайте, и в виджете)'}),ta,btn,status]));
  app.appendChild(el('p',{class:'hint',text:'И про живой букет не забывай хотя бы иногда: этот сад его не заменит.'}));

async function give(day,c,note,btn,status){
  btn.disabled=true;const e={s:c.s,seed:c.seed};note=(note||'').trim().slice(0,240);if(note)e.n=note;
  try{
    status.textContent='Рисую картинку букета для виджета…';await new Promise(r=>setTimeout(r,30));
    const blob=await snapshot(e,900),imgPath='days/'+day+'.jpg';
    status.textContent='Отправляю на GitHub…';
    const oldImg=await getFile(imgPath);await putFile(imgPath,await blobB64(blob),'Букет '+day,oldImg&&oldImg.sha);
    const df=await getFile('data.json');let data={days:{}};if(df){try{data=JSON.parse(unb64u(df.content));if(!data.days)data.days={};}catch(_){}}
    data.days[day]=e;await putFile('data.json',b64u(JSON.stringify(data,null,1)),'Данные '+day,df&&df.sha);
    const num=Object.keys(data.days).sort().indexOf(day)+1,t=titleOf(e);
    const today={date:day,label:'Букет №'+num+' · '+fmtDate(day),name:t.name,desc:t.desc,note:e.n||'',img:imgPath+'?v='+Date.now()};
    const tf=await getFile('today.json');await putFile('today.json',b64u(JSON.stringify(today,null,1)),'Виджет '+day,tf&&tf.sha);
    DATA=data;draft=null;status.textContent='Подарено! Сайт обновится за минуту-две, виджет на её телефоне — в течение получаса.';
    setTimeout(()=>{if(mode==='pick')go('her');},2500);
  }catch(err){btn.disabled=false;status.textContent=(err&&err.message)||'Не получилось сохранить. Попробуй ещё раз.';}
}

  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'Все '+STYLE_KEYS.length+' стилей'}),el('h1',{text:'Из чего бывают букеты'})]));

  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'Только для тебя'}),el('h1',{text:'Настройка'})]));
  app.appendChild(el('p',{class:'pending',text:'Здесь этот телефон или компьютер запоминает твой ключ GitHub. С ним ты можешь дарить букеты. Ключ хранится только на этом устройстве и на сайт не попадает.'}));
  const guess=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'',repoGuess=location.pathname.split('/').filter(Boolean)[0]||'buket';
  const f=el('div',{class:'form'},[field('ghuser','Имя аккаунта GitHub',CFG?CFG.user:guess),field('ghrepo','Имя хранилища',CFG?CFG.repo:repoGuess),
    field('ghtoken','Ключ доступа (начинается с github_pat_)',CFG?CFG.token:'','password','Его нельзя никому показывать.')]);
  const status=el('p',{class:'status',role:'status'}),save=el('button',{class:'give'},['Проверить и сохранить']);
  save.addEventListener('click',async()=>{const c={user:document.getElementById('ghuser').value.trim(),repo:document.getElementById('ghrepo').value.trim(),token:document.getElementById('ghtoken').value.trim()};
    if(!c.user||!c.repo||!c.token){status.textContent='Заполни все три поля.';return;}
    save.disabled=true;status.textContent='Проверяю…';const prev=CFG;CFG=c;
    try{const r=await gh('');if(!r.ok)throw new Error(ghError(r));const j=await r.json();if(j.permissions&&!j.permissions.push)throw new Error('У ключа нет права записи в это хранилище.');
      if(!saveCfg(c))throw new Error('Браузер не даёт сохранить ключ. Открой сайт в обычном (не приватном) окне.');status.textContent='Готово! Теперь можно дарить букеты.';setTimeout(()=>go('pick'),1200);}
    catch(err){CFG=prev;save.disabled=false;status.textContent=err.message||'Не получилось проверить ключ.';}});
  f.appendChild(save);f.appendChild(status);app.appendChild(f);
  if(CFG)app.appendChild(el('button',{class:'linkbtn',onclick:()=>{saveCfg(null);CFG=null;go('her');}},['Забыть ключ на этом устройстве']));
}
function widgetScript(){return WIDGET_SRC.replace('__SITE__',siteBase());}
function renderWidget(){
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'iPhone'}),el('h1',{text:'Букет на главном экране'})]));
  const steps=[['Установи бесплатное приложение ','Scriptable',' из App Store.'],['Нажми кнопку ниже: скрипт виджета скопируется.'],['Открой Scriptable, нажми «+» вверху справа, вставь скрипт (долгое нажатие → «Вставить»), вверху назови его «Букет» и нажми «Done».'],['Нажми на скрипт «Букет» один раз: он покажет букет и спросит про уведомления, нажми «Разрешить». Так будут приходить уведомления о новом букете.'],
    ['Выйди на главный экран, зажми пустое место, нажми «+» (или «Изменить» → «Добавить виджет»), найди Scriptable и выбери размер. Лучше всего смотрится большой и средний.'],['Нажми на появившийся виджет (или «Изменить виджет»), в строке Script выбери «Букет».'],['Готово: виджет сам будет показывать новый букет и записку. Нажатие на виджет открывает сайт, где букет крутится в 3D.']];
  const ol=el('ol',{class:'steps'});steps.forEach(s=>ol.appendChild(el('li',{},s.map((x,i)=>i===1&&s.length===3?el('b',{text:x}):x))));app.appendChild(ol);
  const status=el('p',{class:'status',role:'status'}),pre=el('pre',{class:'code'},[widgetScript()]);
  const btn=el('button',{class:'give'},['Скопировать скрипт виджета']);
  btn.addEventListener('click',()=>{const txt=widgetScript();const ok=()=>{status.textContent='Скопировано. Теперь открой Scriptable.';};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{selectPre();});else selectPre();
    function selectPre(){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);status.textContent='Текст выделен: нажми «Скопировать».';}});
  app.appendChild(btn);app.appendChild(status);app.appendChild(el('details',{},[el('summary',{text:'Показать текст скрипта'}),pre]));
  app.appendChild(el('a',{href:'#',onclick:ev=>{ev.preventDefault();go('her');}},['← К букету']));
}
window.addEventListener('hashchange',()=>{mode=hashMode();render();});
let lastW=window.innerWidth,rt=0;
window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lastW)<40)return;clearTimeout(rt);rt=setTimeout(()=>{lastW=window.innerWidth;render();},300);});
render();loadData();
if(document.fonts&&document.fonts.status!=='loaded')document.fonts.ready.then(()=>{if(LOADED)render();});
})();

</script>
