  /* головы лежат на куполе радиуса DR с центром DC и смотрят наружу; расстояние по куполу между соседями не меньше суммы их радиусов */
  const DR=2.2,DC=-1.05,dome=(pol,az,rad)=>{const s=Math.sin(pol),c=Math.cos(pol),d=V(s*Math.cos(az),c,s*Math.sin(az));return{d,p:V(d.x*(rad||DR),DC+d.y*(rad||DR),d.z*(rad||DR))};};

  const sM=.75,s1=.55,s2=.5,s3=.45,KK=.95,p1=(sM+s1)*KK/DR,p2=p1+(s1+s2)*KK/DR,p3=p2+(s2+s3)*KK/DR;

  for(let i=0;i<6;i++)onDome(KA[i%2],p1,o1+i*TAU/6+(r()-.5)*.06,s1*(.96+r()*.04));
  for(let i=0;i<10;i++){const sp=i===1||i===4||i===7;onDome(sp?KS:KA[(i+1)%2],p2,o1+(i+.5)*TAU/10+(r()-.5)*.05,s2*(sp?.85:.96+r()*.04));}
  for(let i=0;i<14;i++){const K=i%7===3?KM:KA[i%2];onDome(K,p3,o1+(i+.25)*TAU/14+(r()-.5)*.04,s3*(.95+r()*.05));}
  /* ягоды в просветах у края */
  const berries=[];const bh=[355,18,280,330,0,45][Math.floor(r()*6)];
  for(let i=0;i<9;i++){const q=dome((p2+p3)*.5+(r()-.5)*.05,o1+(i+.5)*TAU/9,DR*.95);berries.push({p:q.p,d:q.d,s:mixSeed(seed,'be'+i),n:4+Math.floor(r()*3)});}
  const leaves=[];for(let i=0;i<18;i++)leaves.push({a:o1+.3+i*TAU/18+(r()-.5)*.15,e:-.05+r()*.3,L:1.5+r()*.5,W:.24+r()*.07,serr:r()<.5});
  const eucal=[];for(let i=0;i<7;i++)eucal.push({a:o1+i*TAU/7+.12,e:.05+r()*.3,L:1.7+r()*.4,s:mixSeed(seed,'eu'+i)});
  const ferns=[];for(let i=0;i<6;i++)ferns.push({a:o1+i*TAU/6+.5,e:-.05+r()*.25,L:1.8+r()*.3,s:mixSeed(seed,'fe'+i)});
  /* облачка гипсофилы, чуть утопленные в купол */
  const fillers=[];for(let i=0;i<18;i++){const q=dome(.3+r()*1.15,r()*TAU,DR*(.95+r()*.04));fillers.push({x:q.p.x,y:q.p.y,z:q.p.z,n:6+Math.floor(r()*5),s:mixSeed(seed,'fi'+i)});}
  const kraft=r()<.4;
  const wm=kraft?{h:32,s:36,l:70}:{h:wrapH(H+180+(r()-.5)*40),s:18+r()*16,l:84};
  const wm2={h:wrapH(H+(r()-.5)*30),s:30+r()*20,l:80};
  const rm={h:H+(r()-.5)*20,s:62,l:46,h2:H+12};
  const B={seed,H,k,DR,DC,flowers,leaves,eucal,ferns,fillers,berries,berryHue:bh,wm,wm2,rm,main:KM,second:KA,spike:KS,leafHue:100+r()*30,wingHue:wrapH(H+150+r()*60)};
  if(BCACHE.size>80)BCACHE.clear();BCACHE.set(key,B);return B;
}

function petalGeo(L,W,type,o,colorFn){
  const g=new T3.PlaneGeometry(1,1,o.sx||6,o.sy||10),p=g.attributes.position,cols=new Float32Array(p.count*3),c=new T3.Color();
  for(let i=0;i<p.count;i++){const u=p.getX(i)+.5,t=p.getY(i)+.5,s=(u-.5)*2;
    let w=wf(t,type);if(o.ruffle)w*=1+o.ruffle*Math.sin(t*17+o.phase)*Math.min(1,t*2.5);

    p.setXYZ(i,s*w*W,y,z);colorFn(t,s,c);cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}

function pointsCloud(ctx,n,make,col,size,upd,static_){const pos=new Float32Array(n*3),data=[];for(let i=0;i<n;i++){const d=make(i);data.push(d);pos.set([d.x,d.y,d.z],i*3);}
  const g=new T3.BufferGeometry();g.setAttribute('position',new T3.BufferAttribute(pos,3));
  const m=new T3.PointsMaterial({color:C(col),size,map:dotTex(),transparent:true,depthWrite:false,blending:T3.AdditiveBlending});const p=new T3.Points(g,m);(static_?ctx.root:ctx.bq).add(p);
  if(upd)ctx.anims.push((dt,t)=>{upd(pos,data,dt,t,m);g.attributes.position.needsUpdate=true;});}

function snow(ctx,r,n){pointsCloud(ctx,n,()=>({x:(r()-.5)*7,y:-3+r()*7,z:(r()-.5)*5,v:.2+r()*.3}),'#ffffff',.06,(p,d,dt)=>{d.forEach((q,i)=>{q.y-=q.v*dt;if(q.y<-3)q.y=3.5;p[i*3+1]=q.y;p[i*3]=q.x+Math.sin(q.y*2+i)*.1;});},true);}

/* ================= сборка сцены ================= */
function palOf(st,role,sp){const d=st.pal&&st.pal(role,sp);if(d)return d;
  switch(role){case'petal':return[hslC(sp.h,sp.s,sp.l-20),hslC(sp.h2??sp.h,sp.s,sp.l+12)];
    case'center':return[hslC(sp.h,sp.s,sp.l-14),hslC(sp.h2??sp.h,sp.s,sp.l+10)];
    case'stamen':return[hslC(sp.h,sp.s*.6,sp.l-10),hslC(sp.h,sp.s,sp.l)];
    case'leaf':return leafG(sp).map(x=>x);
    case'stem':return[hslC(110,35,24),hslC(100,35,36)];
    case'filler':return[hslC(60,15,86),hslC(60,10,98)];
    default:return[hslC(sp.h,sp.s,sp.l-10),hslC(sp.h2??sp.h,sp.s,sp.l+6)];}}
function makeObj(ctx,geo,role,sp){const st=ctx.st;if(st.obj)return st.obj(geo,role,sp,ctx);

function partSpec(f,P){
  let h=f.hs.h,s=f.hs.s,l=f.hs.l,h2=f.hs.h2;
  let c=P.col;
  if(c==='narcP'||c==='narcC'){const v=f.seed%3;c=c==='narcP'?(v===1?{h:48,s:92,l:60}:{h:52,s:25,l:92}):(v===0?{h:26,s:95,l:55}:{h:44,s:95,l:55});}
  if(c){h=c.h;s=c.s;l=c.l;h2=c.h2!=null?c.h2:c.h+8;}
  if(P.dh){h+=P.dh;h2+=P.dh;}if(P.dl)l+=P.dl;
  return{h,s,l,h2,white:f.hs.white};
}
function ringGeos(P,cf,r,lo,rot,cr){const out=[];const angs=P.angles?P.angles.map(a=>rot+a):Array.from({length:P.n},(_,i)=>rot+(i+(P.off||0))*TAU/P.n+(r()-.5)*.08);

    g.applyMatrix4(placeMat(a,(P.e||0)+(r()-.5)*.05,P.base!=null?P.base:cr*.5,P.y0||0));out.push(g);});return out;}
function callaGeo(cf){const nu=30,nv=14,pos=[],col=[],idx=[],c=new T3.Color();
  for(let j=0;j<=nv;j++){const v=j/nv,tm=Math.PI*(1-.42*Math.pow(v,1.3));
    for(let i=0;i<=nu;i++){const th=-tm+i/nu*2*tm,back=Math.pow((1+Math.cos(th))/2,3),h=.72+.5*back,y=v*h;
      const r=.05+.34*Math.pow(v,1.35)+.12*Math.pow(v,3)*(1-Math.cos(th))/2;
      pos.push(r*Math.sin(th),y,-r*Math.cos(th)+.04*v);cf(v,0,c);c.multiplyScalar(1-.1*(1-v));col.push(c.r,c.g,c.b);}}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+nu+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new T3.BufferGeometry();g.setAttribute('position',new T3.Float32BufferAttribute(pos,3));g.setAttribute('color',new T3.Float32BufferAttribute(col,3));
  g.setAttribute('uv',new T3.Float32BufferAttribute(new Array(pos.length/3*2).fill(0),2));g.setIndex(idx);g.computeVertexNormals();g.rotateX(-.28);g.scale(1.15,1.15,1.15);return g;}

  const cfOf=sp=>{const pal=palOf(st,'petal',sp);return(t,s,o)=>{o.copy(pal[0]).lerp(pal[1],t);o.multiplyScalar(1-.12*s*s);};};
  const groups=new Map(),put=(sp,geos)=>{const key=sp.h.toFixed(1)+'/'+sp.l.toFixed(1)+'/'+sp.s.toFixed(1);if(!groups.has(key))groups.set(key,{sp,geos:[]});groups.get(key).geos.push(...geos);};

const WIDGET_SRC="// Букет дня: виджет для приложения Scripting (iPhone).\n// Показывает последний подаренный букет и записку,\n// а когда появляется новый букет, присылает уведомление.\nimport { VStack, HStack, Text, Image, Spacer, Widget, Notification } from 'scripting'\n\nconst SITE = '__SITE__'\n\ntype Today = { date: string, label: string, name: string, note: string, img: string }\n\nasync function load(): Promise<Today | null> {\n  try {\n    const r = await fetch(SITE + 'today.json?t=' + Date.now(), { timeout: 20 })\n    if (!r.ok) throw new Error('http ' + r.status)\n    const j = (await r.json()) as Today\n    const prev = Storage.get<string>('lastImg')\n    if (prev && prev !== j.img) {\n      try {\n        await Notification.schedule({\n          title: 'Новый букет 🌸',\n          body: j.note && j.note.length ? j.note : j.name,\n          tapAction: { type: 'openURL', url: SITE }\n        })\n      } catch (e) {}\n    }\n    Storage.set('lastImg', j.img)\n    Storage.set('today', j)\n    return j\n  } catch (e) {\n    return Storage.get<Today>('today')\n  }\n}\n\nfunction Bouquet({ j, size }: { j: Today, size?: number }) {\n  return (\n    <Image\n      imageUrl={SITE + j.img}\n      resizable\n      scaleToFit\n      frame={size ? { width: size, height: size } : undefined}\n      widgetAccentedRenderingMode=\"fullColor\"\n    />\n  )\n}\n\nfunction View({ j }: { j: Today | null }) {\n  if (!j) {\n    return (\n      <VStack widgetURL={SITE}>\n        <Text font=\"headline\">Первый букет скоро появится 🌸<\/Text>\n      <\/VStack>\n    )\n  }\n  const words = j.note && j.note.length ? j.note : j.name\n  const fam = Widget.family\n\n  if (fam === 'systemSmall') {\n    return (\n      <VStack widgetURL={SITE} spacing={2}>\n        <Bouquet j={j} />\n        {j.note ? <Text font=\"caption\" lineLimit={1}>{j.note}<\/Text> : null}\n      <\/VStack>\n    )\n  }\n\n  if (fam === 'systemMedium') {\n    return (\n      <HStack widgetURL={SITE} spacing={12}>\n        <Bouquet j={j} size={140} />\n        <VStack alignment=\"leading\" spacing={6}>\n          <Text font=\"caption\" foregroundStyle=\"#b3305c\">{j.label}<\/Text>\n          <Text font=\"headline\" lineLimit={5}>{words}<\/Text>\n          <Spacer />\n        <\/VStack>\n        <Spacer />\n      <\/HStack>\n    )\n  }\n\n  return (\n    <VStack widgetURL={SITE} spacing={6}>\n      <Bouquet j={j} />\n      <Text font=\"caption\" foregroundStyle=\"#b3305c\">{j.label}<\/Text>\n      <Text font=\"headline\" lineLimit={3}>{words}<\/Text>\n    <\/VStack>\n  )\n}\n\nasync function run() {\n  const j = await load()\n  Widget.present(<View j={j} />, { policy: 'after', date: new Date(Date.now() + 20 * 60 * 1000) })\n}\n\nrun()\n";

  const btn=el('button',{class:'give'},[ex?'Подарить этот вместо прежнего':'Подарить этот букет']);
  btn.addEventListener('click',()=>give(today,c,ta.value,btn,status));
  app.appendChild(el('div',{class:'form'},[el('label',{for:'note',text:'Записка к букету (будет и на сайте, и в виджете)'}),ta,btn,status]));
  app.appendChild(el('p',{class:'hint',text:'И про живой букет не забывай хотя бы иногда: этот сад его не заменит.'}));
}
async function give(day,c,note,btn,status){
  btn.disabled=true;const e={s:c.s,seed:c.seed};if(c.k)e.k=c.k;note=(note||'').trim().slice(0,240);if(note)e.n=note;
  try{
    status.textContent='Рисую картинку букета для виджета…';await new Promise(r=>setTimeout(r,30));
    const blob=await snapshot(e,900),imgPath='days/'+day+'.jpg';
    status.textContent='Отправляю на GitHub…';
    const oldImg=await getFile(imgPath);await putFile(imgPath,await blobB64(blob),'Букет '+day,oldImg&&oldImg.sha);
    const df=await getFile('data.json');let data={days:{}};if(df){try{data=JSON.parse(unb64u(df.content));if(!data.days)data.days={};}catch(_){}}
    data.days[day]=e;await putFile('data.json',b64u(JSON.stringify(data,null,1)),'Данные '+day,df&&df.sha);
    const num=Object.keys(data.days).sort().indexOf(day)+1,t=titleOf(e);
    const today={date:day,label:'Букет №'+num+' · '+fmtDate(day),name:t.name,desc:t.desc,note:e.n||'',img:imgPath+'?v='+Date.now()};
    const tf=await getFile('today.json');await putFile('today.json',b64u(JSON.stringify(today,null,1)),'Виджет '+day,tf&&tf.sha);
    DATA=data;draft=null;status.textContent='Подарено! Сайт обновится за минуту-две, виджет на её телефоне — в течение получаса.';
    setTimeout(()=>{if(mode==='pick')go('her');},2500);
  }catch(err){btn.disabled=false;status.textContent=(err&&err.message)||'Не получилось сохранить. Попробуй ещё раз.';}
}
function renderAll(){
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'Все '+STYLE_KEYS.length+' стилей'}),el('h1',{text:'Из чего бывают букеты'})]));
  const g=el('div',{class:'all'});
  STYLE_KEYS.forEach(k=>{const e={s:k,seed:hashStr('all:'+k)};g.appendChild(el('div',{class:'opt'},[thumb(e,240),el('span',{text:titleOf(e).name})]));});
  app.appendChild(g);
}
function field(id,label,value,type,hint){return el('div',{class:'field'},[el('label',{for:id,text:label}),el('input',{id,type:type||'text',value:value||'',autocomplete:'off',autocapitalize:'off',spellcheck:'false'}),hint?el('p',{class:'hint small',text:hint}):null]);}
function renderSetup(){
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'Только для тебя'}),el('h1',{text:'Настройка'})]));
  app.appendChild(el('p',{class:'pending',text:'Здесь этот телефон или компьютер запоминает твой ключ GitHub. С ним ты можешь дарить букеты. Ключ хранится только на этом устройстве и на сайт не попадает.'}));
  const guess=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'',repoGuess=location.pathname.split('/').filter(Boolean)[0]||'buket';
  const f=el('div',{class:'form'},[field('ghuser','Имя аккаунта GitHub',CFG?CFG.user:guess),field('ghrepo','Имя хранилища',CFG?CFG.repo:repoGuess),
    field('ghtoken','Ключ доступа (начинается с github_pat_)',CFG?CFG.token:'','password','Его нельзя никому показывать.')]);
  const status=el('p',{class:'status',role:'status'}),save=el('button',{class:'give'},['Проверить и сохранить']);
  save.addEventListener('click',async()=>{const c={user:document.getElementById('ghuser').value.trim(),repo:document.getElementById('ghrepo').value.trim(),token:document.getElementById('ghtoken').value.trim()};
    if(!c.user||!c.repo||!c.token){status.textContent='Заполни все три поля.';return;}
    save.disabled=true;status.textContent='Проверяю…';const prev=CFG;CFG=c;
    try{const r=await gh('');if(!r.ok)throw new Error(ghError(r));const j=await r.json();if(j.permissions&&!j.permissions.push)throw new Error('У ключа нет права записи в это хранилище.');
      if(!saveCfg(c))throw new Error('Браузер не даёт сохранить ключ. Открой сайт в обычном (не приватном) окне.');status.textContent='Готово! Теперь можно дарить букеты.';setTimeout(()=>go('pick'),1200);}
    catch(err){CFG=prev;save.disabled=false;status.textContent=err.message||'Не получилось проверить ключ.';}});
  f.appendChild(save);f.appendChild(status);app.appendChild(f);
  if(CFG)app.appendChild(el('button',{class:'linkbtn',onclick:()=>{saveCfg(null);CFG=null;go('her');}},['Забыть ключ на этом устройстве']));
}
function widgetScript(){return WIDGET_SRC.replace('__SITE__',siteBase());}
function renderWidget(){
  app.appendChild(el('header',{},[el('p',{class:'eyebrow',text:'iPhone'}),el('h1',{text:'Букет на главном экране'})]));
  const steps=[['Установи бесплатное приложение ','Scripting',' из App Store (не путать со Scriptable).'],['Нажми кнопку ниже: код виджета скопируется.'],
    ['Открой Scripting, создай новый скрипт и назови его «Букет».'],['Внутри скрипта создай новый файл с именем widget.tsx, вставь в него код (долгое нажатие → «Вставить») и сохрани. Если файл widget.tsx уже есть, замени его содержимое.'],
    ['Выйди на главный экран, зажми пустое место, нажми «Изменить» → «Добавить виджет», найди Scripting и выбери размер: лучше всего большой или средний.'],['Зажми появившийся виджет → «Изменить виджет» и выбери скрипт «Букет».'],
    ['Если Scripting спросит про уведомления, нажми «Разрешить»: так будут приходить уведомления о новом букете.'],['Готово: виджет показывает букет в цвете даже на прозрачном главном экране. Нажатие открывает сайт, где букет крутится в 3D.']];
  const ol=el('ol',{class:'steps'});steps.forEach(s=>ol.appendChild(el('li',{},s.map((x,i)=>i===1&&s.length===3?el('b',{text:x}):x))));app.appendChild(ol);
  const status=el('p',{class:'status',role:'status'}),pre=el('pre',{class:'code'},[widgetScript()]);
  const btn=el('button',{class:'give'},['Скопировать код виджета']);
  btn.addEventListener('click',()=>{const txt=widgetScript();const ok=()=>{status.textContent='Скопировано. Теперь открой Scripting.';};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{selectPre();});else selectPre();
    function selectPre(){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);status.textContent='Текст выделен: нажми «Скопировать».';}});
  app.appendChild(btn);app.appendChild(status);app.appendChild(el('details',{},[el('summary',{text:'Показать текст скрипта'}),pre]));
  app.appendChild(el('a',{href:'#',onclick:ev=>{ev.preventDefault();go('her');}},['← К букету']));
}
window.addEventListener('hashchange',()=>{mode=hashMode();render();});
let lastW=window.innerWidth,rt=0;
window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lastW)<40)return;clearTimeout(rt);rt=setTimeout(()=>{lastW=window.innerWidth;render();},300);});
render();loadData();
if(document.fonts&&document.fonts.status!=='loaded')document.fonts.ready.then(()=>{if(LOADED)render();});
})();
